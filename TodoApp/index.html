<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo App</title>
        <!-- Linkig CSS  -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Main container of the todo app -->
        <div class="container">
            <h1>Todo Apps</h1>
            <!-- Input field to write todo -->
            <input type="text" id="todoInput"
                placeholder="Write your next todo here...">
            <button id="addTodo">Add Todo</button>

            <!-- Filter buttons  -->
            <div class="fileterbtn">
                <button class="filterBtn" data-filter="all">All</button>
                <button class="filterBtn"
                    data-filter="completed">Completed</button>
                <button class="filterBtn" data-filter="pending">Pending</button>
            </div>

            <!-- Todo items will be added here dynamically -->
            <ul id="todoList">

            </ul>
        </div>

        <!-- Linkig js -->
        <script src="function.js"></script>
    </body>
</html>
